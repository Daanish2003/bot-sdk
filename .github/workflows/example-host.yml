name: Example Host

# The example Host (examples/next-prisma): its typecheck, build, smoke test and end-to-end suite.
# Runs on every PR, in parallel with the main CI (ci.yml, whose `check` job is the same kind of run).
on:
  pull_request:

concurrency:
  group: example-host-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  next-prisma:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          # `postgres` always exists; the end-to-end suite needs the second database.
          POSTGRES_DB: ai-chat_e2e_example
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The smoke test recreates its own database on this server.
      SMOKE_ADMIN_URL: postgresql://postgres:password@localhost:5432/postgres
      # Placeholders: the build and the smoke test need them, nothing is deployed.
      DATABASE_URL: postgresql://postgres:password@localhost:5432/ai-chat_example
      AUTH_SECRET: ci-auth-secret-not-for-production
      AUTH_TRUST_HOST: "true"
      KEY_ENCRYPTION_SECRET: ci-key-encryption-secret-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The example's copy of the SDK must match packages/chat-sdk. core/VERSION is excluded: it
      # records the commit and time of each copy, so it differs on every run.
      - name: Copy drift
        run: |
          pnpm -F @ai-chat/chat-sdk copy examples/next-prisma/src/chat-sdk
          dir=examples/next-prisma/src/chat-sdk
          changed="$(git diff --name-only -- "$dir" ":!$dir/core/VERSION")"
          untracked="$(git ls-files --others --exclude-standard -- "$dir")"
          if [ -n "$changed$untracked" ]; then
            echo "$changed$untracked"
            git --no-pager diff -- "$dir"
            echo "::error::examples/next-prisma/src/chat-sdk differs from packages/chat-sdk. Run: pnpm -F @ai-chat/chat-sdk copy examples/next-prisma/src/chat-sdk"
            exit 1
          fi

      - name: Typecheck
        run: pnpm -F @ai-chat/example-next-prisma check-types

      - name: Build
        run: pnpm -F @ai-chat/example-next-prisma build

      - name: Smoke test
        run: |
          pnpm -F @ai-chat/example-next-prisma fake-provider > fake-provider.log 2>&1 &
          pnpm -F @ai-chat/example-next-prisma smoke

      - name: Install Chromium for Playwright
        run: pnpm -F @ai-chat/example-next-prisma exec playwright install --with-deps chromium

      # The suite builds and migrates the example itself (playwright.config.ts webServer) on the
      # database created by the service above, then runs the shared scenarios and its own tests.
      - name: End-to-end tests
        env:
          E2E_DATABASE_URL: postgresql://postgres:password@localhost:5432/ai-chat_e2e_example
        run: pnpm -F @ai-chat/example-next-prisma test:e2e
